name: Contoso offline evaluation

on:
  pull_request:
    paths:
      - 'samples/contoso-evaluation/**'
      - '.github/workflows/evaluate.yml'
  push:
    paths:
      - 'samples/contoso-evaluation/**'
      - '.github/workflows/evaluate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test contracts and failure cases
        run: python3 -m unittest discover -s samples/contoso-evaluation/tests
      - name: Produce baseline and candidate evidence
        run: |
          python3 samples/contoso-evaluation/run.py --candidate baseline --output build/evaluation/baseline.json
          python3 samples/contoso-evaluation/run.py --candidate regressed --output build/evaluation/regressed.json
      - name: Require baseline to pass
        run: |
          python3 samples/contoso-evaluation/gate.py build/evaluation/baseline.json --expected-candidate baseline > build/evaluation/baseline-gate.json
          cat build/evaluation/baseline-gate.json
      - name: Prove the regressed candidate is blocked
        shell: bash
        run: |
          set +e
          python3 samples/contoso-evaluation/gate.py build/evaluation/regressed.json --expected-candidate regressed > build/evaluation/regressed-gate.json
          status=$?
          set -e
          cat build/evaluation/regressed-gate.json
          if [ "$status" -ne 1 ]; then
            echo "Expected a measured gate rejection (1), got $status"
            exit 1
          fi
      - name: Preserve per-item evidence and gate decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contoso-offline-evidence
          path: build/evaluation/
          if-no-files-found: error
          retention-days: 14
