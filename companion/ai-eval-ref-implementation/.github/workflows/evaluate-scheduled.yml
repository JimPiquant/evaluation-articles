# AI Agent Evaluation — Scheduled Full Evaluation
#
# Runs a comprehensive evaluation weekly (or on manual trigger) using the
# full golden dataset. Useful for detecting quality drift and running
# periodic safety assessments.

name: "AI Agent Evaluation — Scheduled"

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  id-token: write
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run full agent evaluation
        uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          deployment-name: ${{ vars.EVALUATION_MODEL }}
          agent-ids: ${{ vars.AGENT_ID }}
          data-path: ${{ github.workspace }}/datasets/eval-config-full.json
